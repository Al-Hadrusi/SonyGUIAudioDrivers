name: Release

# Push a tag like v0.1.0 to build the downloads and publish a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build
    # An older Ubuntu keeps the glibc requirement low, so the binary runs on
    # more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="headphones-control-${VERSION}-x86_64-linux"
          mkdir -p "$DIR/packaging/linux" "$DIR/assets"
          cp target/release/headphones-control "$DIR/"
          cp packaging/linux/headphones-control.desktop packaging/linux/install.sh "$DIR/packaging/linux/"
          cp assets/headphones-control.svg assets/headphones-control-256.png "$DIR/assets/"
          cp LICENSE README.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: headphones-control-*-x86_64-linux.tar.gz

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $dir = "headphones-control-$version-x86_64-windows"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/headphones-control.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: headphones-control-*-x86_64-windows.zip

  release:
    name: Publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum headphones-control-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            headphones-control-*
            SHA256SUMS
