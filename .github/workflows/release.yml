name: Release

# Either push a tag like v0.1.0, or run this workflow by hand ("Run workflow")
# with a version: it then creates the tag itself on the commit it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true

# Least privilege: jobs only get a read-only token unless they ask for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # "0.1.0" from either the manual input or the pushed tag "v0.1.0".
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  # The version ends up in file names, the tag and the release title: only
  # accept a plain semantic version (no slashes, spaces or shell syntax).
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Check version format
        shell: bash
        run: |
          V="${VERSION#v}"
          # Whole-string match (a grep would accept a multi-line value whose
          # first line looks fine, letting it inject lines into $GITHUB_ENV).
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::invalid version: must look like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

  linux:
    name: Linux build
    needs: validate
    # An older Ubuntu keeps the glibc requirement low, so the binary runs on
    # more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, so the toolchain is no longer taken from the ref.
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${VERSION#v}"
          DIR="headphones-control-${VERSION}-x86_64-linux"
          mkdir -p "$DIR/packaging/linux" "$DIR/assets"
          cp target/release/headphones-control "$DIR/"
          cp packaging/linux/headphones-control.desktop packaging/linux/install.sh "$DIR/packaging/linux/"
          cp assets/headphones-control.svg assets/headphones-control-256.png "$DIR/assets/"
          cp LICENSE README.md "$DIR/"
          tar czf "$DIR.tar.gz" "$DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: headphones-control-*-x86_64-linux.tar.gz

  windows:
    name: Windows build
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Pinned by commit, so the toolchain is no longer taken from the ref.
          toolchain: stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "$env:VERSION".TrimStart("v")
          $dir = "headphones-control-$version-x86_64-windows"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item target/release/headphones-control.exe, LICENSE, README.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: headphones-control-*-x86_64-windows.zip

  release:
    name: Publish release
    needs: [validate, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance: verify a download with
      #   gh attestation verify <file> --repo Al-Hadrusi/SonyGUIAudioDrivers
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum headphones-control-* > SHA256SUMS

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            headphones-control-*
            SHA256SUMS

      - name: Tag name
        run: echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Creates the tag on this commit when it doesn't exist yet.
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Headphones Control ${{ env.TAG }}
          generate_release_notes: true
          files: |
            headphones-control-*
            SHA256SUMS
