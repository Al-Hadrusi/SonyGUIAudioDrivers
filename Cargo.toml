[package]
name = "headphones-control"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Unofficial desktop control app for Sony Bluetooth headphones and earbuds (noise cancelling, ambient sound, EQ, ...), written in 100% safe Rust."
license = "MIT"
repository = "https://github.com/Al-Hadrusi/SonyGUIAudioDrivers"
default-run = "headphones-control"

[features]
default = ["bluetooth", "tray", "notifications"]
# Real Bluetooth support: BlueZ on Linux, WinRT on Windows. Without it the
# app runs with the built-in simulated devices only.
bluetooth = ["dep:bluer", "dep:tokio", "dep:futures", "dep:windows", "dep:windows-future"]
# System tray icon (StatusNotifierItem, Linux).
tray = ["dep:ksni"]
# Desktop notifications (low battery), Linux.
notifications = ["dep:notify-rust"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"], optional = true }
tokio = { version = "1", features = ["rt", "time", "macros", "io-util"], optional = true }
futures = { version = "0.3", optional = true }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"], optional = true }
notify-rust = { version = "4", default-features = false, features = ["z"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Sockets",
    "Storage_Streams",
] }
windows-future = { version = "0.3", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = true
