<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 1280x720 video thumbnail. Render: node docs/promo/thumbnail.js -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b0b0d; }
  body { font-family: "Inter", "DejaVu Sans", sans-serif; color: #f4f4f6; -webkit-font-smoothing: antialiased; position: relative; }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
  .phone { position: absolute; right: 36px; top: 40px; width: 352px; height: 716px; border-radius: 46px; background: #050506;
           box-shadow: 0 0 0 2px #2c2c31, 0 40px 100px rgba(0,0,0,.8), 0 0 140px rgba(245,163,27,.25);
           transform: rotate(6deg); }
  .screen { position: absolute; left: 16px; top: 16px; width: 320px; height: 684px; border-radius: 32px; overflow: hidden; }
  .screen img { width: 320px; position: absolute; top: -92px; left: 0; }
  .brand { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
  .headline { position: absolute; left: 68px; top: 190px; font-weight: 900; font-size: 88px; line-height: 1.0; letter-spacing: -2.5px; }
  .headline .a { color: #f5a31b; }
  .pills { position: absolute; left: 72px; bottom: 70px; display: flex; gap: 14px; }
  .pill { padding: 14px 24px; border-radius: 999px; background: #1c1c1f; border: 1px solid #34343a; font-size: 26px; font-weight: 700; }
  .pill.hot { background: #f5a31b; color: #111; border-color: #f5a31b; }
</style>
</head>
<body>
  <div class="glow" style="width:760px;height:760px;right:-120px;top:-160px;background:rgba(245,163,27,.30)"></div>
  <div class="glow" style="width:560px;height:560px;left:-180px;bottom:-260px;background:rgba(76,120,255,.14)"></div>

  <div class="phone"><div class="screen"><img src="shots/status.png"></div></div>

  <div class="brand"><img src="icon.svg"><span>Headphones Control</span></div>
  <div class="headline">Your headphones.<br><span class="a">On your desktop.</span></div>
  <div class="pills">
    <div class="pill hot">Free &amp; open source</div>
    <div class="pill">Linux · Windows</div>
  </div>
</body>
</html>
